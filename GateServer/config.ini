[Upload]
; ---- upload limits (streaming upload) ----
; MaxBytes:        max bytes per upload. 314572800 = 300MB.
;                  !! MUST stay <= kMaxHttpBodyBytes (1GB, the Beast parser cap).
;                  If it exceeds that, an oversized upload is killed by the HTTP
;                  parser before its body can be drained, and the client only
;                  sees a connection reset instead of the JSON error.
; MinBytesPerSec:  minimum sustained upload rate. A peer slower than this for
;                  kSlowPatrolLimit patrol ticks in a row is dropped.
;                  This is the slowloris guard - MaxBytes alone cannot stop a
;                  peer from stretching one upload over hours.
; MaxDurationSec:  hard wall-clock cap for a single upload. 600 = 10 min.
;                  300MB at 512KB/s takes ~10min, so the two agree.
MaxBytes=314572800
MinBytesPerSec=65536
MaxDurationSec=600
