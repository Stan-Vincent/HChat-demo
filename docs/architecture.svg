<svg width="880" height="620" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
<title>HChat 分布式即时通讯系统架构</title>
<desc>Qt 客户端通过 HTTP 访问 GateServer、通过 TCP 访问双 ChatServer，后端经 gRPC 访问 VarifyServer 与 StatusServer，并共享 Redis 与 MySQL。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="560" fill="#FFFFFF"/>

<g>
<rect x="250" y="30" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="49" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Qt 客户端</text>
<text x="340" y="68" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Client</text>
</g>

<path d="M300 86 L200 150" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="222" y="112" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">HTTP</text>
<path d="M380 86 L480 150" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="458" y="112" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">TCP</text>

<g>
<rect x="100" y="150" width="200" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="200" y="169" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">GateServer</text>
<text x="200" y="188" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">账号 / 头像 · 8080</text>
</g>

<g>
<rect x="380" y="150" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="169" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ChatServer × 2</text>
<text x="480" y="188" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">聊天 · 8990 / 8991</text>
</g>

<path d="M480 206 L480 268" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="530" y="238" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">节点间 gRPC</text>

<path d="M150 206 L150 268" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M250 206 L300 268" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="268" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="150" y="287" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">VarifyServer</text>
<text x="150" y="306" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">验证码 · 50051</text>
</g>

<g>
<rect x="300" y="268" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="390" y="287" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">StatusServer</text>
<text x="390" y="306" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">在线状态 · 50052</text>
</g>

<g>
<rect x="530" y="268" width="110" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="585" y="287" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Redis</text>
<text x="585" y="306" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">6380</text>
</g>

<path d="M200 206 L560 287" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M390 324 L520 340" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M420 324 L556 280" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="392" width="240" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="411" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">MySQL</text>
<text x="340" y="430" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">业务库 xxxl · 3308</text>
</g>

<path d="M150 324 L280 392" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M390 324 L400 392" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="415" y="360" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">SQL</text>

<text x="480" y="480" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">gRPC 通信 · 实线为协议链路，虚线为节点间转发</text>
</svg>