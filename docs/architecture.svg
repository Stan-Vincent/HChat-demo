<svg width="880" height="648" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
<title>HChat 分布式即时通讯系统架构</title>
<desc>Qt 客户端经 HTTP 访问 GateServer、经 TCP 访问双 ChatServer；GateServer 经 gRPC 调用 VarifyServer 与 StatusServer；各服务经汇聚总线访问 Redis 与 MySQL。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="500" fill="#FFFFFF"/>

<rect x="250" y="30" width="180" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="49" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Qt 客户端</text>
<text x="340" y="68" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Client</text>

<path d="M290 82 L200 125" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="222" y="101" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">HTTP</text>
<path d="M390 82 L480 125" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="101" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">TCP</text>

<rect x="90" y="125" width="190" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="144" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">GateServer</text>
<text x="185" y="163" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">账号 / 头像 · 8080</text>

<rect x="400" y="125" width="190" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="144" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ChatServer × 2</text>
<text x="495" y="163" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">聊天 · 8990 / 8991</text>
<text x="495" y="182" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">节点间 gRPC 转发</text>

<path d="M185 181 L185 240" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M250 181 L300 240" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="268" y="212" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">gRPC</text>

<rect x="90" y="240" width="190" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="185" y="259" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">VarifyServer</text>
<text x="185" y="278" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">验证码 · 50051</text>

<rect x="290" y="240" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="380" y="259" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">StatusServer</text>
<text x="380" y="278" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">在线状态 · 50052</text>

<path d="M90 168 L55 168 L55 350" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M185 296 L185 350" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M380 296 L380 350" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M495 193 L495 350" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>

<path d="M55 350 L495 350" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>

<path d="M200 350 L200 390" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 350 L480 390" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="110" y="390" width="180" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="409" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Redis</text>
<text x="200" y="428" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">缓存 / 协调 · 6380</text>

<rect x="390" y="390" width="180" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="480" y="409" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">MySQL</text>
<text x="480" y="428" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">业务库 xxxl · 3308</text>

<text x="340" y="480" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">各服务按需访问 Redis / MySQL · 图中仅标注主要链路</text>
</svg>